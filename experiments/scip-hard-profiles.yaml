experiment:
  name: scip_hard_profiles
  solver: scip
  scaling_mode: serial
  resources: [1]
  repetitions: 6
  workloads:
    - /home/Projeto_LAMFO_LAPPS/data/facility_location_easy/hard/CFL_hard_instance_5.lp.gz
    - /home/Projeto_LAMFO_LAPPS/data/facility_location_easy/hard/CFL_hard_instance_10.lp.gz
    - /home/Projeto_LAMFO_LAPPS/data/facility_location_easy/hard/CFL_hard_instance_15.lp.gz
    - /home/Projeto_LAMFO_LAPPS/data/facility_location_easy/hard/CFL_hard_instance_20.lp.gz
    - /home/Projeto_LAMFO_LAPPS/data/facility_location_easy/hard/CFL_hard_instance_25.lp.gz
  profiles:
    - id: default
      kind: default
    - id: presolve-off
      kind: presolve-off
    - id: warm-start
      kind: warm-start
      initial_solution:
        required: true
        files:
          CFL_hard_instance_5.lp.gz: initial_solutions/scip/CFL_hard_instance_5.sol
          CFL_hard_instance_10.lp.gz: initial_solutions/scip/CFL_hard_instance_10.sol
          CFL_hard_instance_15.lp.gz: initial_solutions/scip/CFL_hard_instance_15.sol
          CFL_hard_instance_20.lp.gz: initial_solutions/scip/CFL_hard_instance_20.sol
          CFL_hard_instance_25.lp.gz: initial_solutions/scip/CFL_hard_instance_25.sol

environment:
  track_cores: false
  track_energy_rapl: sysfs
  idle_time_seconds: 0

output:
  directory: resultados_finais/scip_hard_profiles
