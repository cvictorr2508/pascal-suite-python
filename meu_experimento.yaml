# ==============================================================================
# PASCAL SUITE RESEARCH CONFIGURATION
# ==============================================================================

# To use this architecture in a research campaign:
# 1. Add the `.mps/.lp` paths to `workloads`.
# 2. Give the experiment a unique `name`.
# 3. Set `model_sense` to `MAXIMIZE` or `MINIMIZE`.
# 4. If this file is renamed, update the two paths in `master.slurm`.
# 5. Submit the job with `sbatch master.slurm`.

experiment:
  name: "pesquisa_gurobi_v1_instances_0"  # Used in generated JSON and CSV names.
  model_sense: "MINIMIZE"     # Either "MAXIMIZE" or "MINIMIZE".
  scaling_mode: "strong"      # "strong" keeps workloads fixed across core counts.
  resources: [1, 2, 4, 8, 16] # Solver thread/core treatments.
  repetitions: 3              # Repetitions per treatment.

  workloads:
    # List the research instances here.
    # - "instances/dummy.mps"
    # - "instances/large_model_1.mps"
    # - "instances/large_model_2.lp"
    - "/home/Projeto_LAMFO_LAPPS/data/facility_location_easy/train/CFL_easy_instance_0.lp"
    - "/home/Projeto_LAMFO_LAPPS/data/facility_location_easy/medium/CFL_medium_instance_0.lp"
    - "/home/Projeto_LAMFO_LAPPS/data/facility_location_easy/hard/CFL_hard_instance_0.lp"

environment:
  # Disable Analyzer core tracking because of the NPAD psutil limitation.
  track_cores: False
  # Measure CPU/package energy through the Linux RAPL sysfs backend.
  track_energy_rapl: "sysfs"
  # Allow the processor to cool and reduce inter-run thermal noise.
  idle_time_seconds: 5.0

output:
  # Directory for generated Analyzer JSON and runner metadata.
  directory: "resultados_finais/instances_0"
