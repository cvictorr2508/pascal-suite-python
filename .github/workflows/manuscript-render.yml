name: Render research manuscript

on:
  pull_request:
    paths:
      - "_quarto.yml"
      - "index.qmd"
      - "references.bib"
      - "_extensions/**"
      - "scripts/check_sbc_pdf.py"
      - ".github/workflows/manuscript-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Check Quarto installation
        run: quarto check

      - name: Render frozen manuscript
        run: quarto render

      - name: Run SBC PDF regression
        run: python3 scripts/check_sbc_pdf.py

      - name: Upload manuscript and visual-review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-manuscript
          path: |
            _manuscript/
            artifacts/
          if-no-files-found: error
