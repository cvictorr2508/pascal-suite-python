name: Publish research manuscript

on:
  push:
    branches:
      - main
    paths:
      - "_quarto.yml"
      - "index.qmd"
      - "references.bib"
      - "bibliography/**"
      - "manuscript/**"
      - "publication/**"
      - "_extensions/**"
      - "scripts/check_sbc_pdf.py"
      - "scripts/check_bibliography_provenance.py"
      - ".github/workflows/manuscript-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Render and validate manuscript
        run: |
          python3 scripts/check_bibliography_provenance.py
          quarto check
          quarto render
          python3 scripts/check_sbc_pdf.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _manuscript

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
