# ==============================================================================
# CONFIGURAÇÃO DA PESQUISA - PASCALSUITE
# ==============================================================================

# Para usar essa arquitetura na sua pesquisa, a sua rotina será apenas:
# 1. Abrir este arquivo `meu_experimento.yaml` e colocar a lista dos seus `.mps` na seção `workloads`.
# 2. Mudar o nome do experimento em `name:` (ex: `pesquisa_artigo_2026`).
# 3. Mudar o arquivo `run_analysis_2.py` para apontar para esse nome.
# 4. Digitar no terminal: `sbatch run_analysis_master.sh`

experiment:
  name: "experiment_gurobi_cfl_easy_instance_0"  # O nome que vai nos arquivos JSON e CSV
  model_sense: "MINIMIZE"     # definir sentido "MAXIMIZE" ou "MINIMIZE"
  scaling_mode: "strong"      # "strong" = testa os mesmos arquivos em diferentes cores
  resources: [1, 2, 4, 8, 16] # Quantidade de Threads/Cores a testar
  repetitions: 3              # Quantas vezes repetir cada rodada (para tirar a média)
  
  workloads:
    # Liste aqui o caminho para todas as suas instâncias reais
    #- "instances/dummy.mps"
    # - "instances/meu_modelo_pesado_1.mps"
    # - "instances/meu_modelo_pesado_2.lp"
    - "/home/Projeto_LAMFO_LAPPS/data/facility_location_easy/train/CFL_easy_instance_0.lp"
    

environment:
  # Desligamos o track_cores (False) por conta do bug do psutil no NPAD
  track_cores: False
  # Ligamos a medição de energia (Joules) da CPU e RAM via sensores do Linux
  track_energy_rapl: "sysfs"
  # Tempo que o cluster descansa de braços cruzados (em segundos) entre as 
  # rodadas para esfriar o processador e limpar o calor/ruído.
  idle_time_seconds: 5.0

output:
  # A pasta onde os milhares de arquivos JSON vão ficar salvos
  directory: "resultados_finais/easy"
